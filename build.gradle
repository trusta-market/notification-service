plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.trustamarket'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	def gprUser = findProperty('gpr.user') ?: System.getenv('GPR_USER')
	def gprToken = findProperty('gpr.token') ?: System.getenv('GPR_TOKEN')
	if (!gprUser || !gprToken) {
		throw new GradleException("GitHub Packages 자격증명 필요: gpr.user/GPR_USER 와 gpr.token/GPR_TOKEN 을 ~/.gradle/gradle.properties 또는 환경변수로 설정하세요.")
	}
	mavenCentral()
	maven {
		url = uri("https://maven.pkg.github.com/trusta-market/common")
		content {
			includeGroup 'com.trustamarket'
		}
		credentials {
			username = gprUser
			password = gprToken
		}
	}
}

ext {
	set('springCloudVersion', "2025.0.2")
}

dependencies {
	implementation 'com.trustamarket:common:0.0.1-SNAPSHOT'
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'io.github.openfeign:feign-hc5'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
