apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-service
          image: asia-northeast3-docker.pkg.dev/trusta-market-id/trusta-registry-services/notification-service:PLACEHOLDER
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8120
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            # Discord webhook URL — 미리 Secret 'notification-secrets' 생성 필요.
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: DISCORD_WEBHOOK_URL
          # request 는 실 사용량 기반 (CPU ~3m, memory ~250Mi, burst 여유 포함).
          # limit 은 thread 800 stack (~800MB) + heap (limit*25%=500MB) + 기타 = ~1.5GB 안에 맞춤.
          # request 줄임 → 노드당 pod 수 증가 → HPA scale 자리 확보.
          resources:
            requests:
              cpu: 100m
              memory: 800Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8120
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8120
            periodSeconds: 5
