apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-service
          image: asia-northeast3-docker.pkg.dev/trusta-market-id/trusta-registry-services/notification-service:PLACEHOLDER
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8120
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            # Discord webhook URL — 미리 Secret 'notification-secrets' 생성 필요.
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: DISCORD_WEBHOOK_URL
          # 부하 측정 시 일관된 환경 위해 limit 제거 (variable 줄임). burst 시 노드 free 까지 사용 — 터져도 OK.
          # request 만 유지 (스케줄링 위해).
          resources:
            requests:
              cpu: 100m
              memory: 800Mi
            # limits:
            #   cpu: 1500m
            #   memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8120
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8120
            periodSeconds: 5
